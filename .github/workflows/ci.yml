name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CI: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check (typecheck, lint, format, banned patterns, unit tests)
        run: npm run check
      - name: Engine coverage
        run: npm run test:coverage
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and e2e
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
