name: CI

# Runs on pushes to main and wip/* (what build sessions push) and on PRs into
# main. Not on `release`: its commit was already tested on main (D8, D15).
on:
  push:
    branches: [main, 'wip/**']
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']

# Never cancel main runs: autonomous runs judge CI by the latest completed run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CI: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, lint, format, banned patterns
        run: npm run typecheck && npm run lint && npm run format:check && npm run banned
      - name: Unit tests with engine coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Bundle the desktop main process (no Electron binary needed)
        run: npm run build -w @the-system/desktop
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
