name: Release

# Desktop builds (ROADMAP MS.6, MQ.9, D8, D15, D55, D97).
# - Push to `release`: build Windows (installer only, QF.11) and Linux
#   (AppImage, kept for the automated smoke test; macOS dropped, D97),
#   smoke-test both packaged apps, then
#   publish a GitHub Release named `preview-<date>-<run>` (tag
#   `preview-<date>-<run>.<attempt>`; build sessions cannot push tags, the
#   workflow creates it). Every file name carries `preview-<date>-<run>`
#   (MS.7), and the notes list the commits since the previous preview.
# - Push to `release-dry-run`: the same builds and checks, no Release.
# - Manual: Actions → Release → Run workflow (Luke's one-click publish,
#   D93). Publishes a preview from the chosen branch, normally main.
on:
  push:
    branches: [release, release-dry-run]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  # electron-builder downloads its own Electron zip; the npm package's binary is not needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # One build id for every job, so files made either side of midnight match (MS.7).
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: id
        run: echo "id=$(node scripts/release-notes.mjs id "$(date -u +%Y-%m-%d)" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            files: apps/desktop/release/*.AppImage
          - os: windows-latest
            target: win
            files: |
              apps/desktop/release/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      THE_SYSTEM_BUILD_ID: ${{ needs.meta.outputs.id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web and server
        run: npm run build
      - name: Package desktop app
        run: npm run package -w @the-system/desktop -- --${{ matrix.target }}
      - name: Smoke-test the packaged Linux app
        if: matrix.target == 'linux'
        run: |
          npx playwright install --with-deps chromium
          THE_SYSTEM_PACKAGED_EXE="$PWD/apps/desktop/release/linux-unpacked/the-system" \
            npm run package:smoke -w @the-system/desktop
      - name: Smoke-test the packaged Windows app
        if: matrix.target == 'win'
        run: |
          THE_SYSTEM_PACKAGED_EXE="$PWD/apps/desktop/release/win-unpacked/TheSystem.exe" \
            npx playwright test -c apps/desktop/playwright.packaged.config.ts
      # QF.11: a download that stopped halfway must refuse to start, never hang.
      # NSIS checks its own CRC; run a half-length copy silently and expect a
      # non-zero exit within a minute.
      - name: A partial installer refuses to start
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/*-setup.exe | Select-Object -First 1
          $partial = Join-Path $env:RUNNER_TEMP 'partial-setup.exe'
          Copy-Item $setup.FullName $partial
          $stream = [System.IO.File]::Open($partial, 'Open')
          $stream.SetLength([long]($setup.Length / 2))
          $stream.Close()
          $p = Start-Process $partial -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'the partial installer hung' }
          if ($p.ExitCode -eq 0) { throw 'the partial installer exited 0 instead of refusing' }
          Write-Output "partial installer refused with exit code $($p.ExitCode)"
      - name: Smoke-test the AppImage itself
        if: matrix.target == 'linux'
        run: |
          image=$(ls apps/desktop/release/*.AppImage)
          data=$(mktemp -d)
          THE_SYSTEM_PORT=30411 THE_SYSTEM_DATA_DIR="$data" APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run -a "$image" --no-sandbox > "$data/log" 2>&1 &
          ok=''
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:30411/health; then echo; ok=1; break; fi
            sleep 1
          done
          pkill -f 'linux-x86_64.AppImage|appimage_extracted' || true
          if [ -z "$ok" ]; then cat "$data/log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      THE_SYSTEM_BUILD_ID: ${{ needs.meta.outputs.id }}
    steps:
      # Full history and tags, for the "what changed" list.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check every artifact is present
        run: |
          ls -la out
          total=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$total" -ne 2 ]; then echo "expected exactly 2 files, found $total"; exit 1; fi
          # Exact names (MS.7): TheSystem-preview-<date>-<run>-win-x64-setup.exe and so on.
          for suffix in win-x64-setup.exe linux-x86_64.AppImage; do
            name="TheSystem-${THE_SYSTEM_BUILD_ID}-${suffix}"
            if [ ! -f "out/$name" ]; then echo "missing $name"; exit 1; fi
            echo "ok $name"
          done
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest published preview before this one (drafts left by a failed run are skipped).
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 50 \
            --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("preview-"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -n "$previous" ] && ! git -C repo rev-parse -q --verify "refs/tags/$previous" > /dev/null; then
            echo "tag $previous not found locally; listing no changes"
            previous=''
          fi
          (cd repo && node scripts/release-notes.mjs notes "${previous:--}" "$GITHUB_SHA") > changes.md
          cat changes.md
      - name: Publish the preview release
        if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$THE_SYSTEM_BUILD_ID"
          # Unique per run and per re-run attempt; the title is the build id.
          tag="${id}.${GITHUB_RUN_ATTEMPT}"
          notes=$(mktemp)
          cat > "$notes" <<NOTES
          Preview build of The System from ${GITHUB_SHA::7}.

          - Windows: TheSystem-${id}-win-x64-setup.exe (installer; it checks itself, so a partial download says so instead of starting). Unsigned: if SmartScreen warns, choose More info, then Run anyway. A "Starting The System…" window appears while it starts; launching it again brings the running window to the front.
          - Linux: TheSystem-${id}-linux-x86_64.AppImage. Make it executable (chmod +x), then run it.

          Double-click starts the server and opens the GM console; players join at the URL or QR code it shows. If port 30333 is taken, The System uses the next free port and tells you.

          NOTES
          # Each file's exact size and SHA-256, installer first (QF.11): a
          # download that stops early is visible before it is run.
          {
            echo "Files (compare the size if a download seems broken):"
            echo
            for suffix in win-x64-setup.exe linux-x86_64.AppImage; do
              f="out/TheSystem-${id}-${suffix}"
              echo "- $(basename "$f"): $(stat -c %s "$f") bytes, SHA-256 \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
            echo
          } >> "$notes"
          cat changes.md >> "$notes"
          # Draft first, so a failed upload never leaves a half-filled public release.
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$id" \
            --prerelease \
            --draft \
            --notes-file "$notes"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
