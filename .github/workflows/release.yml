name: Release

# Desktop builds (ROADMAP MS.6, D8, D15, D55).
# - Push to `release`: build Windows (installer + portable), macOS (dmg,
#   unsigned, universal) and Linux (AppImage), smoke-test the Linux build, then
#   publish a GitHub Release named `preview-<date>` (tag
#   `preview-<date>-<run number>`; build sessions cannot push tags, the
#   workflow creates it).
# - Push to `release-dry-run`: the same builds and checks, no Release.
on:
  push:
    branches: [release, release-dry-run]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  # electron-builder downloads its own Electron zip; the npm package's binary is not needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            files: apps/desktop/release/*.AppImage
          - os: windows-latest
            target: win
            files: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-portable.exe
          # Intel runner: macos-latest (arm64) jobs were never picked up for lack of
          # capacity (D55); the universal dmg still runs on Apple Silicon.
          - os: macos-15-intel
            target: mac
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web and server
        run: npm run build
      - name: Package desktop app
        run: npm run package -w @the-system/desktop -- --${{ matrix.target }}
      - name: Smoke-test the packaged Linux app
        if: matrix.target == 'linux'
        run: |
          npx playwright install --with-deps chromium
          THE_SYSTEM_PACKAGED_EXE="$PWD/apps/desktop/release/linux-unpacked/the-system" \
            npm run package:smoke -w @the-system/desktop
      - name: Smoke-test the packaged Windows app
        if: matrix.target == 'win'
        run: |
          THE_SYSTEM_PACKAGED_EXE="$PWD/apps/desktop/release/win-unpacked/TheSystem.exe" \
            npx playwright test -c apps/desktop/playwright.packaged.config.ts
      - name: Smoke-test the packaged macOS app
        if: matrix.target == 'mac'
        run: |
          app="$PWD/apps/desktop/release/mac-universal/The System.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          THE_SYSTEM_PACKAGED_EXE="$app/Contents/MacOS/The System" \
            npx playwright test -c apps/desktop/playwright.packaged.config.ts
      - name: Smoke-test the AppImage itself
        if: matrix.target == 'linux'
        run: |
          image=$(ls apps/desktop/release/*.AppImage)
          data=$(mktemp -d)
          THE_SYSTEM_PORT=30411 THE_SYSTEM_DATA_DIR="$data" APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run -a "$image" --no-sandbox > "$data/log" 2>&1 &
          ok=''
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:30411/health; then echo; ok=1; break; fi
            sleep 1
          done
          pkill -f 'linux-x86_64.AppImage|appimage_extracted' || true
          if [ -z "$ok" ]; then cat "$data/log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check every artifact is present
        run: |
          ls -la out
          total=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$total" -ne 4 ]; then echo "expected exactly 4 files, found $total"; exit 1; fi
          for pattern in '*-win-x64-setup.exe' '*-win-x64-portable.exe' '*-mac-universal.dmg' '*-linux-x86_64.AppImage'; do
            count=$(find out -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$count" -ne 1 ]; then echo "expected one $pattern, found $count"; exit 1; fi
          done
      - name: Publish the preview release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y-%m-%d)
          # Unique per run and per re-run attempt; the title stays preview-<date>.
          tag="preview-${day}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes=$(mktemp)
          cat > "$notes" <<NOTES
          Preview build of The System from ${GITHUB_SHA::7}.

          - Windows: TheSystem-*-win-x64-setup.exe (installer) or TheSystem-*-win-x64-portable.exe (no install). Unsigned: if SmartScreen warns, choose More info, then Run anyway.
          - macOS: TheSystem-*-mac-universal.dmg. Not notarized: right-click the app, choose Open, then Open again. If macOS still says it is damaged, run \`xattr -cr "/Applications/The System.app"\` in Terminal once.
          - Linux: TheSystem-*-linux-x86_64.AppImage. Make it executable (chmod +x), then run it.

          Double-click starts the server and opens the GM console; players join at the URL or QR code it shows.
          NOTES
          # Draft first, so a failed upload never leaves a half-filled public release.
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "preview-${day}" \
            --prerelease \
            --draft \
            --notes-file "$notes"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
