# electron-builder config for the desktop app (ROADMAP MS.6, D55).
# Everything the main process needs is bundled into dist/main.cjs by build.mjs,
# so no node_modules ship; the web build rides along as resources/web.
appId: app.the-system.gm
productName: The System
copyright: The System contributors
directories:
  output: release
  buildResources: build-resources
files:
  - dist/main.cjs
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter: ['**/*']
  # MC.5 (D236): the native speech engine, outside the asar so its addon
  # loads. Only this platform's package is installed when CI packages, so only
  # it ships. The speech model itself downloads on first use.
  - from: ../../node_modules
    to: speech/node_modules
    filter:
      [
        'sherpa-onnx-node/**/*',
        'sherpa-onnx-win-x64/**/*',
        'sherpa-onnx-linux-x64/**/*',
        'sherpa-onnx-darwin-*/**/*',
      ]
asar: true
# QF.45: the packaged app cannot be turned into a plain Node runtime or
# debugged through its command line or environment.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
publish: null
# File names carry the build id (MS.7): a new download never collides with an
# older copy that is still open. package.mjs always sets THE_SYSTEM_BUILD_ID.
artifactName: TheSystem-${env.THE_SYSTEM_BUILD_ID}-${os}-${arch}.${ext}
# Installer only (QF.11): electron-builder's portable template turns NSIS's
# CRC check off, so a partial download started and hung.
win:
  executableName: TheSystem
  target:
    - target: nsis
      arch: [x64]
nsis:
  # QF.45: build-resources/installer.nsh asks a running copy to quit cleanly.
  include: build-resources/installer.nsh
  artifactName: TheSystem-${env.THE_SYSTEM_BUILD_ID}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.games
  # Ad-hoc signature (not notarized): a universal app with no signature at all
  # is reported as damaged on Apple Silicon.
  identity: '-'
linux:
  executableName: the-system
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
  category: Game
